<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Argus — cybersec browser of the NetGuard Pro Suite
    Argus Panoptes : géant aux 100 yeux de la mythologie grecque
    Designed to feel like a sister product to NetGuard (same palette + grid + glow)
  -->
  <defs>
    <linearGradient id="argusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4d9fff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#b47dff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3dffb4;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3dffb4;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#4d9fff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b47dff;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0.6"/>
    </radialGradient>
    <filter id="argusGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle (matches NetGuard family) -->
  <circle cx="100" cy="100" r="92" fill="#0f0f13" stroke="#ffffff08" stroke-width="1"/>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#argusGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- Tech grid (same as NetGuard) -->
  <g opacity="0.06" stroke="#4d9fff" stroke-width="0.5">
    <line x1="20" y1="60"  x2="180" y2="60"/>
    <line x1="20" y1="100" x2="180" y2="100"/>
    <line x1="20" y1="140" x2="180" y2="140"/>
    <line x1="60"  y1="20" x2="60"  y2="180"/>
    <line x1="100" y1="20" x2="100" y2="180"/>
    <line x1="140" y1="20" x2="140" y2="180"/>
  </g>

  <!-- Outer ring of small eyes (the 100 yeux, stylized as 24 visible) -->
  <g opacity="0.85" filter="url(#argusGlow)">
    <!-- 24 eyes around r=78 -->
    <g id="outerEyes">
      <circle cx="100" cy="22"  r="2.2" fill="url(#argusGrad)"/>
      <circle cx="120" cy="24"  r="1.8" fill="#4d9fff"/>
      <circle cx="140" cy="32"  r="2"   fill="url(#argusGrad)"/>
      <circle cx="156" cy="46"  r="1.8" fill="#b47dff"/>
      <circle cx="170" cy="64"  r="2.2" fill="url(#argusGrad)"/>
      <circle cx="176" cy="84"  r="1.8" fill="#3dffb4"/>
      <circle cx="178" cy="100" r="2"   fill="url(#argusGrad)"/>
      <circle cx="176" cy="116" r="1.8" fill="#4d9fff"/>
      <circle cx="170" cy="136" r="2.2" fill="url(#argusGrad)"/>
      <circle cx="156" cy="154" r="1.8" fill="#b47dff"/>
      <circle cx="140" cy="168" r="2"   fill="url(#argusGrad)"/>
      <circle cx="120" cy="176" r="1.8" fill="#3dffb4"/>
      <circle cx="100" cy="178" r="2.2" fill="url(#argusGrad)"/>
      <circle cx="80"  cy="176" r="1.8" fill="#4d9fff"/>
      <circle cx="60"  cy="168" r="2"   fill="url(#argusGrad)"/>
      <circle cx="44"  cy="154" r="1.8" fill="#b47dff"/>
      <circle cx="30"  cy="136" r="2.2" fill="url(#argusGrad)"/>
      <circle cx="24"  cy="116" r="1.8" fill="#3dffb4"/>
      <circle cx="22"  cy="100" r="2"   fill="url(#argusGrad)"/>
      <circle cx="24"  cy="84"  r="1.8" fill="#4d9fff"/>
      <circle cx="30"  cy="64"  r="2.2" fill="url(#argusGrad)"/>
      <circle cx="44"  cy="46"  r="1.8" fill="#b47dff"/>
      <circle cx="60"  cy="32"  r="2"   fill="url(#argusGrad)"/>
      <circle cx="80"  cy="24"  r="1.8" fill="#3dffb4"/>
    </g>
  </g>

  <!-- Inner ring of small eyes (r=58, 16 eyes) -->
  <g opacity="0.7">
    <circle cx="100" cy="42"  r="1.6" fill="#4d9fff"/>
    <circle cx="122" cy="48"  r="1.4" fill="#b47dff"/>
    <circle cx="140" cy="60"  r="1.6" fill="#3dffb4"/>
    <circle cx="152" cy="78"  r="1.4" fill="#4d9fff"/>
    <circle cx="158" cy="100" r="1.6" fill="#b47dff"/>
    <circle cx="152" cy="122" r="1.4" fill="#3dffb4"/>
    <circle cx="140" cy="140" r="1.6" fill="#4d9fff"/>
    <circle cx="122" cy="152" r="1.4" fill="#b47dff"/>
    <circle cx="100" cy="158" r="1.6" fill="#3dffb4"/>
    <circle cx="78"  cy="152" r="1.4" fill="#4d9fff"/>
    <circle cx="60"  cy="140" r="1.6" fill="#b47dff"/>
    <circle cx="48"  cy="122" r="1.4" fill="#3dffb4"/>
    <circle cx="42"  cy="100" r="1.6" fill="#4d9fff"/>
    <circle cx="48"  cy="78"  r="1.4" fill="#b47dff"/>
    <circle cx="60"  cy="60"  r="1.6" fill="#3dffb4"/>
    <circle cx="78"  cy="48"  r="1.4" fill="#4d9fff"/>
  </g>

  <!-- Connecting lines between eyes (network feel) -->
  <g opacity="0.15" stroke="url(#argusGrad)" stroke-width="0.4" fill="none">
    <line x1="100" y1="22"  x2="100" y2="42"/>
    <line x1="178" y1="100" x2="158" y2="100"/>
    <line x1="100" y1="178" x2="100" y2="158"/>
    <line x1="22"  y1="100" x2="42"  y2="100"/>
    <line x1="156" y1="46"  x2="140" y2="60"/>
    <line x1="156" y1="154" x2="140" y2="140"/>
    <line x1="44"  y1="154" x2="60"  y2="140"/>
    <line x1="44"  y1="46"  x2="60"  y2="60"/>
  </g>

  <!-- Central panoptic eye -->
  <g filter="url(#softGlow)">
    <!-- Almond shape (eyelid) -->
    <path d="M 60 100 Q 100 70, 140 100 Q 100 130, 60 100 Z"
          fill="none" stroke="url(#argusGrad)" stroke-width="2.5" opacity="0.95"/>
    <!-- Iris -->
    <circle cx="100" cy="100" r="18" fill="url(#irisGrad)" opacity="0.95"/>
    <!-- Iris detail rays -->
    <g opacity="0.4" stroke="#0a0a0f" stroke-width="0.6">
      <line x1="100" y1="84" x2="100" y2="92"/>
      <line x1="100" y1="108" x2="100" y2="116"/>
      <line x1="84"  y1="100" x2="92"  y2="100"/>
      <line x1="108" y1="100" x2="116" y2="100"/>
      <line x1="89"  y1="89"  x2="94"  y2="94"/>
      <line x1="106" y1="106" x2="111" y2="111"/>
      <line x1="111" y1="89"  x2="106" y2="94"/>
      <line x1="94"  y1="106" x2="89"  y2="111"/>
    </g>
    <!-- Pupil -->
    <circle cx="100" cy="100" r="7" fill="url(#pupilGlow)"/>
    <!-- Pupil highlight -->
    <circle cx="103" cy="97" r="2.2" fill="#ffffff" opacity="0.85"/>
    <circle cx="97"  cy="103" r="0.9" fill="#3dffb4" opacity="0.7"/>
  </g>

  <!-- Subtle scanning arc (cybersec feel) -->
  <g opacity="0.5">
    <path d="M 100 28 A 72 72 0 0 1 172 100" fill="none" stroke="#3dffb4" stroke-width="1" stroke-dasharray="2,3"/>
  </g>
</svg>
