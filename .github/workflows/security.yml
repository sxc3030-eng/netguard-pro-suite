name: Security
on: [push, pull_request]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll => report only Medium / High severity (skip Low noise)
      - run: bandit -r . -x tests/,backups/,branding/ -ll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # || true => audit failures are informational, don't block PRs
      - run: pip-audit -r requirements.txt || true
